[package]
name = "kildongmu_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
chacha20 = "0.9"
poly1305 = "0.8"
base64 = "0.22"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
